<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Babylon Lite - Scene 316 - Volumetric Fog (Bundle)</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #101522;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
                cursor: grab;
            }
            canvas:active {
                cursor: grabbing;
            }
            .controls {
                position: absolute;
                top: 12px;
                left: 12px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                max-width: calc(100vw - 24px);
            }
            .hint {
                padding: 4px 6px;
                color: #f2f2f2;
                background: #111b;
                font: 13px system-ui;
                pointer-events: none;
            }
            .volume-control {
                display: flex;
                align-items: center;
                gap: 5px;
                padding: 3px 6px;
                color: #f2f2f2;
                background: #111b;
                font: 13px system-ui;
                white-space: nowrap;
            }
            .volume-control select {
                font: inherit;
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas"></canvas>
        <div class="controls">
            <button type="button" id="fogToggle">Fog: On</button>
            <button type="button" id="shapeToggle" aria-pressed="true">Cloud shape: On</button>
            <button type="button" id="cameraReset">Reset view</button>
            <button type="button" id="deviceLoss" hidden>Simulate device loss</button>
            <label class="volume-control" id="volumeControl" title="Both 3D fog textures use this resolution; cloud noise is procedural">
                3D texture
                <select id="volumeSize" aria-label="Fog 3D texture size">
                    <option value="low">Low (16px, 64 Z)</option>
                    <option value="standard">Standard (8px, 80 Z)</option>
                    <option value="depth">Depth detail (8px, 160 Z)</option>
                    <option value="fine">XY detail (4px, 80 Z)</option>
                </select>
                <output id="volumeDims" for="volumeSize"></output>
            </label>
            <span class="hint">Drag: orbit · Right-drag: pan · Wheel: zoom</span>
        </div>
        <script type="module" src="/lite/bundle/scene316.js"></script>
    </body>
</html>

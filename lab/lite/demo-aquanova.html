<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Babylon Lite — Demo: Aquanova</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .hint {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem; color: #cdd6e0; background: rgba(0,0,0,0.4);
      padding: 6px 10px; border-radius: 6px; pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    This page loads the production-BUNDLED demo (tree-shaken + minified) from
    /lite/bundle/demos/. Run `pnpm build:bundle-demo aquanova` (or
    `pnpm build:bundle-demos`) to (re)generate the bundle this page references.
  -->
  <canvas id="renderCanvas"></canvas>
  <div class="hint">Aquanova — click to capture mouse &nbsp;·&nbsp; move mouse: look &nbsp;·&nbsp; WASD: move &nbsp;·&nbsp; LMB: liquefy &nbsp;·&nbsp; Space: jump &nbsp;·&nbsp; Shift: run &nbsp;·&nbsp; V: free-fly &nbsp;·&nbsp; I: inspect &nbsp;·&nbsp; B: colliders &nbsp;·&nbsp; Esc: release</div>
  <script type="module" src="/lite/bundle/demos/aquanova.js"></script>
</body>
</html>
